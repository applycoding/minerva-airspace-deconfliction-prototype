name: ci
on: [push, pull_request]
jobs:
  windows-build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install PySide6-Essentials==6.12.0 shapely==2.2.0 pyproj==3.8.0 numpy==2.5.4 pytest==9.2.0 pyinstaller==6.22.3
          python -m pip install -e . --no-deps
      - name: Source tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: Build standalone directory
        run: pyinstaller --noconfirm --clean minerva.spec
      - name: Frozen checks outside checkout
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/minerva/minerva.exe').Path
          $smoke = Join-Path $env:RUNNER_TEMP 'minerva_smoke'
          New-Item -ItemType Directory -Force $smoke | Out-Null
          $env:MINERVA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'minerva_appdata'
          $env:MINERVA_DB_PATH = Join-Path $env:MINERVA_DATA_DIR 'minerva.sqlite3'
          $env:PYTHONPATH = ''
          $checkout = (Get-Location).Path
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not $_.StartsWith($checkout) }) -join ';'
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Set-Location $smoke
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & $exe --self-check
          if ($LASTEXITCODE -ne 0 -or $watch.Elapsed.TotalSeconds -ge 60) { throw 'Frozen self-check failed or exceeded 60 seconds' }
          $marker = Join-Path $env:RUNNER_TEMP 'gui_smoke_ok.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          & $exe --gui-smoke --marker-file $marker
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $marker)) { throw 'GUI smoke failed' }
      - name: Verification evidence for implemented slices
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m pytest -v --junitxml=reports/slices_1_to_4.xml
          python -m minerva --self-check
      - name: Zip bundle
        run: Compress-Archive -Path dist/minerva -DestinationPath dist/minerva-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: minerva-windows-evidence
          path: |
            reports/
            dist/minerva-windows.zip
  linux-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install PySide6-Essentials==6.12.0 shapely==2.2.0 pyproj==3.8.0 numpy==2.5.4 pytest==9.2.0 pyinstaller==6.22.3
          python -m pip install -e . --no-deps
      - name: Tests and self-check
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -v
          python -m minerva --self-check
